# ==============================================================================
# Spring Boot Configuration: Docker / Production Profile (docker)
# Connects to containerized PostgreSQL 15 database
# ==============================================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:public-toilet-db}:${DB_PORT:5432}/${POSTGRES_DB:toilet_tracker_db}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${POSTGRES_USER:tracker_user}
spring.datasource.password=${POSTGRES_PASSWORD:tracker_secret}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
