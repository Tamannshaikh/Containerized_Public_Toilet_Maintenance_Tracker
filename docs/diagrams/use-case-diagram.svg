<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 500; fill: #475569; }
      .actor-label { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: #1e293b; text-anchor: middle; }
      .actor-role { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 10px; font-weight: 500; fill: #64748b; text-anchor: middle; }
      .usecase-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #1e293b; text-anchor: middle; }
      .boundary-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #2563eb; letter-spacing: 0.5px; }
      .meta { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; fill: #64748b; }
    </style>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="650" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Header -->
  <text x="40" y="38" class="title">System Use-Case Architecture Diagram</text>
  <text x="40" y="58" class="subtitle">Containerized Public Toilet Maintenance Tracker | Student: Tamanna Shaikh (24102A2006) | VIT Mumbai</text>
  <line x1="40" y1="72" x2="960" y2="72" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- System Boundary Box -->
  <rect x="230" y="90" width="540" height="530" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6 4" filter="url(#shadow)" />
  <text x="250" y="118" class="boundary-title">System Boundary: Public Toilet Maintenance Tracker</text>

  <!-- ================= ACTORS (Left Column) ================= -->
  
  <!-- Actor 1: Citizen / Commuter -->
  <g transform="translate(100, 150)">
    <circle cx="20" cy="18" r="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <line x1="20" y1="32" x2="20" y2="60" stroke="#2563eb" stroke-width="2" />
    <line x1="0" y1="42" x2="40" y2="42" stroke="#2563eb" stroke-width="2" />
    <line x1="20" y1="60" x2="5" y2="85" stroke="#2563eb" stroke-width="2" />
    <line x1="20" y1="60" x2="35" y2="85" stroke="#2563eb" stroke-width="2" />
    <text x="20" y="105" class="actor-label">Citizen / Commuter</text>
    <text x="20" y="118" class="actor-role">Public User</text>
  </g>

  <!-- Actor 2: Cleaning Staff -->
  <g transform="translate(100, 310)">
    <circle cx="20" cy="18" r="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
    <line x1="20" y1="32" x2="20" y2="60" stroke="#16a34a" stroke-width="2" />
    <line x1="0" y1="42" x2="40" y2="42" stroke="#16a34a" stroke-width="2" />
    <line x1="20" y1="60" x2="5" y2="85" stroke="#16a34a" stroke-width="2" />
    <line x1="20" y1="60" x2="35" y2="85" stroke="#16a34a" stroke-width="2" />
    <text x="20" y="105" class="actor-label">Cleaning Staff</text>
    <text x="20" y="118" class="actor-role">Field Sanitation Crew</text>
  </g>

  <!-- Actor 3: Maintenance Technician -->
  <g transform="translate(100, 470)">
    <circle cx="20" cy="18" r="14" fill="#fef3c7" stroke="#d97706" stroke-width="2" />
    <line x1="20" y1="32" x2="20" y2="60" stroke="#d97706" stroke-width="2" />
    <line x1="0" y1="42" x2="40" y2="42" stroke="#d97706" stroke-width="2" />
    <line x1="20" y1="60" x2="5" y2="85" stroke="#d97706" stroke-width="2" />
    <line x1="20" y1="60" x2="35" y2="85" stroke="#d97706" stroke-width="2" />
    <text x="20" y="105" class="actor-label">Maintenance Tech</text>
    <text x="20" y="118" class="actor-role">Plumbing / Repairs</text>
  </g>

  <!-- ================= ACTORS (Right Column) ================= -->

  <!-- Actor 4: Sanitation Supervisor -->
  <g transform="translate(860, 210)">
    <circle cx="20" cy="18" r="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" />
    <line x1="20" y1="32" x2="20" y2="60" stroke="#7c3aed" stroke-width="2" />
    <line x1="0" y1="42" x2="40" y2="42" stroke="#7c3aed" stroke-width="2" />
    <line x1="20" y1="60" x2="5" y2="85" stroke="#7c3aed" stroke-width="2" />
    <line x1="20" y1="60" x2="35" y2="85" stroke="#7c3aed" stroke-width="2" />
    <text x="20" y="105" class="actor-label">Sanitation Supervisor</text>
    <text x="20" y="118" class="actor-role">Ward Inspector</text>
  </g>

  <!-- Actor 5: Municipal Administrator -->
  <g transform="translate(860, 420)">
    <circle cx="20" cy="18" r="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2" />
    <line x1="20" y1="32" x2="20" y2="60" stroke="#dc2626" stroke-width="2" />
    <line x1="0" y1="42" x2="40" y2="42" stroke="#dc2626" stroke-width="2" />
    <line x1="20" y1="60" x2="5" y2="85" stroke="#dc2626" stroke-width="2" />
    <line x1="20" y1="60" x2="35" y2="85" stroke="#dc2626" stroke-width="2" />
    <text x="20" y="105" class="actor-label">System Administrator</text>
    <text x="20" y="118" class="actor-role">Municipal IT / DevOps</text>
  </g>

  <!-- ================= USE CASES (Ovals) ================= -->

  <!-- UC1: Search Facilities & Hygiene Ratings (MVP 2) -->
  <g transform="translate(310, 135)" filter="url(#shadow)">
    <ellipse cx="110" cy="22" rx="100" ry="20" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
    <text x="110" y="26" class="usecase-text">UC-01: Search Facilities &amp; Scores</text>
  </g>

  <!-- UC2: Report Defect / Log Ticket (MVP 1) -->
  <g transform="translate(540, 135)" filter="url(#shadow)">
    <ellipse cx="105" cy="22" rx="95" ry="20" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
    <text x="105" y="26" class="usecase-text">UC-02: Report Defect / Ticket</text>
  </g>

  <!-- UC3: Track Complaint Ticket Status -->
  <g transform="translate(420, 195)" filter="url(#shadow)">
    <ellipse cx="100" cy="22" rx="95" ry="20" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
    <text x="100" y="26" class="usecase-text">UC-03: Track Ticket Status</text>
  </g>

  <!-- UC4: Log Cleaning Event & Checklist (MVP 1) -->
  <g transform="translate(290, 265)" filter="url(#shadow)">
    <ellipse cx="110" cy="22" rx="105" ry="20" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />
    <text x="110" y="26" class="usecase-text">UC-04: Log Cleaning Shift &amp; Checklist</text>
  </g>

  <!-- UC5: Record Consumable Replenishment -->
  <g transform="translate(535, 265)" filter="url(#shadow)">
    <ellipse cx="110" cy="22" rx="105" ry="20" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />
    <text x="110" y="26" class="usecase-text">UC-05: Record Consumables</text>
  </g>

  <!-- UC6: Update Incident Lifecycle State (MVP 4) -->
  <g transform="translate(415, 335)" filter="url(#shadow)">
    <ellipse cx="115" cy="22" rx="110" ry="20" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" />
    <text x="115" y="26" class="usecase-text">UC-06: Resolve Defect Ticket (Lifecycle)</text>
  </g>

  <!-- UC7: View Dashboard & Summary KPIs (MVP 2 & 3) -->
  <g transform="translate(290, 405)" filter="url(#shadow)">
    <ellipse cx="115" cy="22" rx="110" ry="20" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5" />
    <text x="115" y="26" class="usecase-text">UC-07: Inspect KPI Dashboard</text>
  </g>

  <!-- UC8: Drill-Down Facility Timeline (MVP 4) -->
  <g transform="translate(535, 405)" filter="url(#shadow)">
    <ellipse cx="110" cy="22" rx="105" ry="20" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5" />
    <text x="110" y="26" class="usecase-text">UC-08: Facility Status Drill-Down</text>
  </g>

  <!-- UC9: Monitor Critical Alerts & SLA Exceptions (MVP 5) -->
  <g transform="translate(415, 475)" filter="url(#shadow)">
    <ellipse cx="115" cy="22" rx="110" ry="20" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" />
    <text x="115" y="26" class="usecase-text">UC-09: Monitor Critical Alerts (SLA)</text>
  </g>

  <!-- UC10: Manage Facilities & System Health -->
  <g transform="translate(415, 545)" filter="url(#shadow)">
    <ellipse cx="115" cy="22" rx="110" ry="20" fill="#f8fafc" stroke="#475569" stroke-width="1.5" />
    <text x="115" y="26" class="usecase-text">UC-10: Manage Facilities &amp; System</text>
  </g>

  <!-- ================= ASSOCIATIONS (Connecting Lines) ================= -->
  
  <!-- Citizen connections -->
  <line x1="145" y1="185" x2="310" y2="157" stroke="#94a3b8" stroke-width="1.5" />
  <line x1="145" y1="185" x2="540" y2="157" stroke="#94a3b8" stroke-width="1.5" />
  <line x1="145" y1="185" x2="420" y2="217" stroke="#94a3b8" stroke-width="1.5" />

  <!-- Cleaning Staff connections -->
  <line x1="145" y1="345" x2="290" y2="287" stroke="#94a3b8" stroke-width="1.5" />
  <line x1="145" y1="345" x2="535" y2="287" stroke="#94a3b8" stroke-width="1.5" />

  <!-- Maintenance Tech connections -->
  <line x1="145" y1="505" x2="420" y2="217" stroke="#94a3b8" stroke-width="1.5" />
  <line x1="145" y1="505" x2="415" y2="357" stroke="#94a3b8" stroke-width="1.5" />

  <!-- Sanitation Supervisor connections -->
  <line x1="855" y1="245" x2="515" y2="427" stroke="#94a3b8" stroke-width="1.5" />
  <line x1="855" y1="245" x2="745" y2="427" stroke="#94a3b8" stroke-width="1.5" />
  <line x1="855" y1="245" x2="645" y2="497" stroke="#94a3b8" stroke-width="1.5" />
  <line x1="855" y1="245" x2="630" y2="357" stroke="#94a3b8" stroke-width="1.5" />

  <!-- Administrator connections -->
  <line x1="855" y1="455" x2="645" y2="497" stroke="#94a3b8" stroke-width="1.5" />
  <line x1="855" y1="455" x2="645" y2="567" stroke="#94a3b8" stroke-width="1.5" />
</svg>
