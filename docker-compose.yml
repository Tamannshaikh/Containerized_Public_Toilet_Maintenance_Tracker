services:
  public-toilet-app:
    image: public-toilet-tracker:v1.0.0
    build:
      context: .
      dockerfile: Dockerfile
    container_name: public-toilet-app
    restart: always
    ports:
      - "${APP_PORT:-8085}:8081"
    environment:
      - SERVER_PORT=8081
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-docker}
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:postgresql://public-toilet-db:5432/toilet_tracker_db}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-tracker_user}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-tracker_secret}
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:-org.postgresql.Driver}
      - SPRING_JPA_DATABASE_PLATFORM=${SPRING_JPA_DATABASE_PLATFORM:-org.hibernate.dialect.PostgreSQLDialect}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
    depends_on:
      public-toilet-db:
        condition: service_healthy
    networks:
      - public-toilet-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  public-toilet-db:
    image: postgres:15-alpine
    container_name: public-toilet-db
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-toilet_tracker_db}
      - POSTGRES_USER=${POSTGRES_USER:-tracker_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-tracker_secret}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tracker_user} -d ${POSTGRES_DB:-toilet_tracker_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - public-toilet-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:

networks:
  public-toilet-net:
    driver: bridge
