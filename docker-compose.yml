version: '3.8'

services:
  public-toilet-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: public-toilet-app
    restart: always
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - SPRING_DATASOURCE_URL=jdbc:postgresql://public-toilet-db:5432/toilet_tracker_db
      - SPRING_DATASOURCE_USERNAME=tracker_user
      - SPRING_DATASOURCE_PASSWORD=tracker_secret
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      public-toilet-db:
        condition: service_healthy
    networks:
      - public-toilet-net

  public-toilet-db:
    image: postgres:15-alpine
    container_name: public-toilet-db
    restart: always
    environment:
      - POSTGRES_DB=toilet_tracker_db
      - POSTGRES_USER=tracker_user
      - POSTGRES_PASSWORD=tracker_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker_user -d toilet_tracker_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - public-toilet-net

volumes:
  pgdata:

networks:
  public-toilet-net:
    driver: bridge
