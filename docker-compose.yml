version: '3.8'

services:
  toilet-tracker-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: toilet-maintenance-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://toilet-tracker-db:5432/toilet_tracker_db
      - SPRING_DATASOURCE_USERNAME=tracker_user
      - SPRING_DATASOURCE_PASSWORD=tracker_secret
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      toilet-tracker-db:
        condition: service_healthy
    networks:
      - tracker-net

  toilet-tracker-db:
    image: postgres:15-alpine
    container_name: toilet-maintenance-db
    restart: always
    environment:
      - POSTGRES_DB=toilet_tracker_db
      - POSTGRES_USER=tracker_user
      - POSTGRES_PASSWORD=tracker_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker_user -d toilet_tracker_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tracker-net

volumes:
  pgdata:

networks:
  tracker-net:
    driver: bridge
